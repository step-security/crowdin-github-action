name: 'test'

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - 'main'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Crowdin Action
        uses: ./
        with:
          command: 'push'
          command_args: '-h'

      - name: Get CLI version
        uses: ./
        with:
          command: 'init'
          command_args: '-V'
